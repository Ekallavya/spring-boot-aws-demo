apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-demo-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: spring-boot-demo-app
  template:
    metadata:
      labels:
        app: spring-boot-demo-app
    spec:
      containers:
        - name: spring-boot-demo-app
          image: 667503138853.dkr.ecr.ap-south-2.amazonaws.com/spring-boot-aws-demo-ecr:latest
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: myapp-service
spec:
  selector:
    app: spring-boot-demo-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer